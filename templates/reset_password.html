{% extends "base.html" %}

{% block title %}Reset Password - Sequence BioLab Analytics{% endblock %}

{% block content %}
<div class="page-container auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Set New Password</h1>
            <p>Choose a strong password for your account.</p>
        </div>
        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="auth-field">
                <label for="new_password">
                    <span class="field-label">New Password</span>
                </label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" autocomplete="new-password" required autofocus>
                </div>
                <small class="field-hint">Minimum 8 characters.</small>
            </div>
            <div class="auth-field">
                <label for="confirm_password">
                    <span class="field-label">Confirm Password</span>
                </label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
                </div>
            </div>
            <button type="submit" class="auth-submit">
                <span>Reset Password</span>
                <i class="fas fa-check"></i>
            </button>
        </form>
        <div class="auth-switch">
            <span>Need a new link?</span>
            <a href="{{ url_for('auth.forgot_password') }}">Request one</a>
        </div>
    </div>
</div>
{% endblock %}
