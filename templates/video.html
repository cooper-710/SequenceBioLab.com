{% extends "base.html" %}

{% block title %}Video - Sequence BioLab{% endblock %}

{% block extra_head %}
<style>
    /* Override page-container for fullscreen video */
    .page-container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    .page-header {
        display: none; /* Hide header for fullscreen */
    }
    
    .content-wrapper {
        background: transparent !important;
        border-radius: 0 !important;
        padding: 0 !important;
        border: none !important;
        flex: 1;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    .video-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
    }
    
    .video-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
    
    .video-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-secondary);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Video</h1>
        <p class="page-subtitle">Video Analysis & Review</p>
    </div>

    <div class="content-wrapper">
        <div class="video-wrapper">
            <iframe 
                id="video-iframe"
                class="video-iframe" 
                src="{{ video_url }}"
                allowfullscreen
                loading="lazy">
                <div class="video-loading">
                    <p>Loading video player...</p>
                </div>
            </iframe>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Handle iframe loading
    const iframe = document.getElementById('video-iframe');
    if (iframe) {
        iframe.addEventListener('load', function() {
            console.log('Video iframe loaded');
        });
        
        iframe.addEventListener('error', function() {
            console.error('Error loading video iframe');
        });
    }
</script>
{% endblock %}
