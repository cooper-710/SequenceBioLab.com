services:
  - type: web
    name: sequencebiolab
    env: python
    buildCommand: pip install -r requirements-web.txt && playwright install chromium && (python scripts/update_player_teams.py || true)
    # Use 2 gunicorn workers so file uploads don't block the entire app
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 600 wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: UPLOAD_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PLAYER_PDF_MAX_BYTES
        value: 15728640
      - key: DOCUMENT_REQUEST_CLEANUP_ENABLED
        value: 0
